<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="settings-container">
        <h1>Gemini AI Chatbot</h1>
        <p>請輸入您的 Gemini API 金鑰</p>
        <input type="password" id="api-key-input" placeholder="在此輸入您的 API 金鑰">
        <button id="save-key-button">儲存</button>
    </div>

    <div id="chat-container" class="hidden">
        <div id="chat-history"></div>
        <div id="chat-input-container">
            <textarea id="chat-input" placeholder="在這裡輸入訊息..." rows="1"></textarea>
            <button id="send-button">傳送</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
